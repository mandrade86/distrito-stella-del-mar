# Staging: app + MySQL (VPS GoDaddy / servidor con Docker)
# Uso: docker compose -f docker-compose.staging.yml --env-file .env up -d --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_staging}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-distrito_staging}
      MYSQL_USER: ${MYSQL_USER:-distrito}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-distrito_staging}
    volumes:
      - distrito_mysql_staging:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_staging}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_ENV: staging
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-distrito}:${MYSQL_PASSWORD:-distrito_staging}@mysql:3306/${MYSQL_DATABASE:-distrito_staging}
      NEXT_PUBLIC_SITE_ENV: staging
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    volumes:
      - distrito_uploads_staging:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  distrito_mysql_staging:
  distrito_uploads_staging:
